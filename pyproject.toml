[project]
name = "rag-production"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pymupdf>=1.24",
    "llama-index-core>=0.11",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "typing-extensions>=4.12",
    "ragas==0.1.21",
    "langchain-community==0.2.19",
    # Pinned to the last version compatible with the langchain-core 0.2.x
    # line langchain-community==0.2.19 above requires (4.x+ needs
    # langchain-core>=1.6, a breaking upgrade this project isn't pinned for).
    "langchain-google-genai==1.0.10",
    "datasets>=2.19",
    "pandas>=2.0",
    "llama-index-retrievers-bm25>=0.3",
    "llama-index-llms-ollama>=0.5",
    "redis>=5.0",
    "voyageai>=0.3",
    "google-genai>=2.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[[tool.mypy.overrides]]
module = [
    "pandas",
    "datasets",
    "ragas.*",
    "llama_index.llms.ollama",
    "llama_index.retrievers.bm25",
]
ignore_missing_imports = true
